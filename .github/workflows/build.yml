name: Build jsctweak dylib (theos, proven path)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: theos make + ldid cert-sign
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          ln -sf "$(xcrun -sdk iphoneos --show-sdk-path)" $HOME/theos/sdks/iPhoneOS15.8.sdk
          (brew uninstall ldid 2>/dev/null || true)
          curl -L -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64
          chmod +x /usr/local/bin/ldid
          ldid 2>&1 | head -3
          export PATH="$HOME/theos/bin:$PATH"
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: make package (the proven theos build)
        run: |
          export THEOS=$HOME/theos
          export PATH="$HOME/theos/bin:$PATH"
          make package

      - name: Cert-sign (ldid -K legacy)
        run: |
          mkdir -p build
          cp .theos/obj/debug/jsctweak.dylib build/jsctweak.dylib
          ldid -Kkey_legacy.p12 -Utest -S build/jsctweak.dylib

      - name: Inspect
        run: |
          file build/jsctweak.dylib
          vtool -show build/jsctweak.dylib || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsctweak-dylib
          path: build/jsctweak.dylib
          retention-days: 30
